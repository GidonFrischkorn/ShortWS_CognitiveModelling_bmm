# Shared configuration for all workshop decks in slides/.
# Individual decks only declare title/subtitle/author/date + `format: revealjs`.
# Do NOT add a second format key here — that would render every deck twice.

engine: knitr

# Native browser MathML: formulas render without loading MathJax from a CDN,
# so the decks work with no network at the venue (see README, presenter notes).
html-math-method: mathml

format:
  revealjs:
    theme: [default, custom.scss]
    slide-number: true
    transition: fade
    code-fold: false
    highlight-style: github
    fig-align: center
    width: 1280
    height: 720
    logo: images/bmm_logo.png
    navigation-mode: linear
    controls: true
    progress: true
    # Attribution on every slide — the decks get screenshotted and reshared,
    # and the LICENSE file does not travel with a screenshot.
    footer: "Frischkorn, Li & Chávez De la Peña · Psychonomics 2026 · [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)"

execute:
  echo: true
  warning: false
  message: false
